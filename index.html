<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Coach AI - 你的个人成长助手</title>
    <!-- 引入样式文件 -->
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- 页面头部 -->
    <header class="header">
        <h1 class="header__title">Life Coach AI</h1>
        <p class="header__subtitle">你的个人成长助手</p>
    </header>

    <!-- 主要聊天区域 -->
    <main class="chat">
        <!-- 消息显示区域 -->
        <div class="chat__messages" id="messageContainer">
            <!-- 欢迎消息 -->
            <div class="message message--ai">
                <div class="message__content">
                    你好！我是你的Life Coach AI助手。让我们开始探讨你的个人成长之旅吧！
                </div>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="chat__input">
            <form id="chatForm" class="input-form">
                <textarea
                    id="userInput"
                    class="input-form__textarea"
                    placeholder="输入你想说的话..."
                    rows="3"
                ></textarea>
                <button type="submit" class="input-form__button">发送</button>
            </form>
        </div>
    </main>

    <!-- 引入JavaScript文件 -->
    <script src="scripts/main.js"></script>
</body>
</html>
